<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Local Gym Planner Docker container health check">
  <title>Gym Planner Docker Health</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      background: #f4f6f8;
      color: #172033;
    }
    body { margin: 0; padding: 32px 16px; }
    main { width: min(760px, 100%); margin: 0 auto; }
    header { margin-bottom: 20px; }
    h1 { margin: 0 0 6px; font-size: clamp(24px, 5vw, 36px); }
    header p { margin: 0; color: #667085; }
    .summary { margin: 20px 0; padding: 14px 16px; border-radius: 10px; background: #172033; color: #fff; }
    .summary strong { display: block; font-size: 18px; }
    .summary span { display: block; margin-top: 4px; color: #cbd5e1; font-size: 13px; }
    .services { display: grid; gap: 12px; }
    .service { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; border: 1px solid #d9dee7; border-radius: 10px; background: #fff; }
    .name { font-weight: 700; }
    .details { display: block; margin-top: 4px; color: #667085; font-size: 13px; }
    .state { color: #667085; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .state::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #98a2b3; }
    .online { color: #087443; }
    .online::before { background: #12b76a; }
    .offline { color: #b42318; }
    .offline::before { background: #f04438; }
    button { margin-top: 20px; padding: 10px 14px; border: 0; border-radius: 8px; background: #1769aa; color: #fff; cursor: pointer; font: inherit; }
    button:hover { background: #12558b; }
    @media (max-width: 520px) { body { padding: 24px 12px; } .service { align-items: flex-start; flex-direction: column; gap: 8px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Gym Planner Docker health</h1>
      <p>Only this project's backend, database, and frontend services.</p>
    </header>
    <section class="summary" aria-live="polite">
      <strong id="summary-title">Checking containers...</strong>
      <span id="summary-detail">Testing the published local ports.</span>
    </section>
    <section class="services" aria-label="Gym Planner containers">
      <article class="service">
        <div><span class="name">backend</span><span class="details">Django API - localhost:8000</span></div>
        <span id="backend-state" class="state">Checking</span>
      </article>
      <article class="service">
        <div><span class="name">db</span><span class="details">PostgreSQL - localhost:5432</span></div>
        <span id="db-state" class="state">Via backend</span>
      </article>
      <article class="service">
        <div><span class="name">frontend</span><span class="details">Nginx / Flutter Web - localhost:8080</span></div>
        <span id="frontend-state" class="state">Checking</span>
      </article>
    </section>
    <button type="button" onclick="checkContainers()">Refresh status</button>
  </main>
  <script>
    async function checkPort(url, stateId, mode) {
      const state = document.getElementById(stateId);
      state.textContent = 'Checking';
      state.className = 'state';
      try {
        const response = await fetch(url, { mode: mode || 'cors', cache: 'no-store' });
        if (!response.ok && response.status !== 401 && response.status !== 403) throw new Error('Unavailable');
        state.textContent = 'Running';
        state.className = 'state online';
        return true;
      } catch (error) {
        state.textContent = 'Offline';
        state.className = 'state offline';
        return false;
      }
    }

    async function checkContainers() {
      const summaryTitle = document.getElementById('summary-title');
      const summaryDetail = document.getElementById('summary-detail');
      summaryTitle.textContent = 'Checking containers...';
      const backendOnline = await checkPort('http://localhost:8000/api/schema/', 'backend-state');
      document.getElementById('db-state').textContent = backendOnline ? 'Connected' : 'Unknown';
      document.getElementById('db-state').className = backendOnline ? 'state online' : 'state offline';
      const frontendOnline = await checkPort('http://localhost:8080/', 'frontend-state', 'no-cors');
      const onlineCount = Number(backendOnline) + Number(frontendOnline) + Number(backendOnline);
      summaryTitle.textContent = onlineCount === 3 ? 'All containers are running' : `${onlineCount} of 3 services responding`;
      summaryDetail.textContent = backendOnline ? 'Backend is responding, so the database connection is available.' : 'Start the backend stack and frontend container, then refresh.';
    }

    checkContainers();
  </script>
</body>
</html>
