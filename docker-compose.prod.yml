version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: gym_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # binds to 0.0.0.0 by default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gym_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym_backend
    # In production use gunicorn bound to all interfaces (0.0.0.0)
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput || true &&
             gunicorn gym_project.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env.prod
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gym_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gym_frontend
    env_file: .env.prod
    # In prod serve static assets from Nginx inside the image; no source mount
    ports:
      - "80:80" # binds to 0.0.0.0 by default
    restart: unless-stopped
    networks:
      - gym_network

volumes:
  postgres_data:

networks:
  gym_network:
    driver: bridge
