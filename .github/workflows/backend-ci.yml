name: Backend tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Django tests (gym_api)
    runs-on: ubuntu-latest
    env:
      # Switches backend/gym_project/settings.py to SQLite instead of
      # Postgres (see the DATABASES block) — no service container needed,
      # and manage.py test builds/migrates a fresh test DB automatically.
      DJANGO_TESTING: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile's base image (python:3.13-slim) so CI
          # exercises the same interpreter version as the real container.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Django tests
        working-directory: backend
        run: python manage.py test gym_api --noinput
