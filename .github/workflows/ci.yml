name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: "3.24.5"
      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend
      - name: Generate code (Drift)
        run: flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: frontend
      - name: Analyze
        run: flutter analyze
        working-directory: frontend
      - name: Test
        run: flutter test
        working-directory: frontend

  build-android-debug:
    name: Build Android debug APK
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: "3.24.5"
      - run: flutter pub get
        working-directory: frontend
      - run: flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: frontend
      - name: Build debug APK
        run: flutter build apk --debug
        working-directory: frontend
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk

  build-ios-debug:
    name: Build iOS debug (no codesign)
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: "3.24.5"
      - run: flutter pub get
        working-directory: frontend
      - run: flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: frontend
      - name: Build debug iOS app
        run: flutter build ios --debug --no-codesign
        working-directory: frontend
      - name: Upload debug iOS app
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-app
          path: frontend/build/ios/iphoneos/Runner.app

  publish-debug-release:
    name: Publish debug builds to Releases
    needs: [build-android-debug, build-ios-debug]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts/android
      - name: Download iOS debug app
        uses: actions/download-artifact@v4
        with:
          name: ios-debug-app
          path: artifacts/ios
      - name: Zip iOS app for release
        run: |
          mkdir -p artifacts/ios
          if [ -d artifacts/ios/Runner.app ]; then
            zip -r ios-debug.app.zip Runner.app
          else
            zip -r ios-debug.app.zip . -x '.*'
          fi
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "debug-${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --title "Debug build ${GITHUB_SHA::7}" \
            --notes "Automated debug build from ${GITHUB_SHA} (run ${{ github.run_number }})." \
            artifacts/android/app-debug.apk \
            artifacts/ios/ios-debug.app.zip
