name: CI/CD Pipeline

# One linked pipeline instead of independent workflows: two fast checks run in
# parallel, packaging only runs once both pass, a single aggregate gate makes
# branch-protection configuration trivial, and the release stages only run on
# push to main once every earlier stage is green. See CI_NOTES.md for the
# full job graph and the reasoning behind each stage.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# PRs: cancel a stale run when new commits land on the same PR (fast
# feedback, no wasted minutes). Pushes to main: never cancel a release
# mid-flight, and serialize pushes to main on the same group so two rapid
# pushes can't race each other's tag/release creation.
concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; only the jobs that actually push a tag / create
# a release escalate to `contents: write` on themselves below.
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  # ---------------------------------------------------------------------
  # Stage 1 — fast, independent checks. Run in parallel; nothing later
  # starts until both are green.
  # ---------------------------------------------------------------------
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Switches backend/gym_project/settings.py to SQLite instead of
      # Postgres (see the DATABASES block) — no service container needed,
      # and manage.py test builds/migrates a fresh test DB automatically.
      DJANGO_TESTING: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile's base image (python:3.13-slim) so CI
          # exercises the same interpreter version as the real container.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Django tests
        working-directory: backend
        run: python manage.py test gym_api --noinput

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js (ensure GitHub runner uses supported Node)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Generate Drift code
        working-directory: frontend
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: frontend
        run: flutter test

  # ---------------------------------------------------------------------
  # Stage 2 — packaging. Only proven-good code gets built into an image;
  # this also validates the two services still compose together.
  # ---------------------------------------------------------------------
  docker-build:
    name: Docker build
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # .env.dev is checked into the repo (see git ls-files), so no secrets
      # setup is needed here — this only proves the images build, it never
      # starts the stack or talks to a real database/network.
      - name: Build development images
        run: ./docker.dev.sh build

  # ---------------------------------------------------------------------
  # Single aggregate gate. Point branch-protection "required status checks"
  # at this one job instead of three — renaming/adding a check upstream
  # never requires touching branch-protection settings again.
  # ---------------------------------------------------------------------
  pipeline-status:
    name: Pipeline status
    needs: [backend-tests, frontend-tests, docker-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check upstream job results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs did not succeed:" >&2
            echo "  backend-tests: ${{ needs.backend-tests.result }}" >&2
            echo "  frontend-tests: ${{ needs.frontend-tests.result }}" >&2
            echo "  docker-build: ${{ needs.docker-build.result }}" >&2
            exit 1
          fi
          echo "All required checks passed."

  # ---------------------------------------------------------------------
  # Stage 3 — release (push to main only). Re-validating tests here would
  # just repeat frontend-tests, which pipeline-status already guarantees
  # passed, so this only does the parts unique to a release build.
  # ---------------------------------------------------------------------
  android:
    name: Build, tag, and publish Android
    needs: pipeline-status
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Generate Drift code
        working-directory: frontend
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > frontend/android/release-keystore.jks
            cat > frontend/android/key.properties <<EOF
            storeFile=../release-keystore.jks
              storePassword=$ANDROID_KEYSTORE_PASSWORD
              keyAlias=$ANDROID_KEY_ALIAS
              keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          fi

      - name: Determine next semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)[[:space:]]*$/\1 \2/p' frontend/pubspec.yaml)"
          read -r configured_version configured_code <<< "$current"
          existing_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n 1)"
          if [ -n "$existing_tag" ]; then
            version="${existing_tag#v}"
            version_code="$((configured_code + $(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | wc -l | tr -d ' ')))"
            tag_exists=true
          else
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [ -z "$latest_tag" ]; then
              version="$configured_version"
              version_code="$configured_code"
            else
              latest="${latest_tag#v}"
              IFS=. read -r major minor patch <<< "$latest"
              version="$major.$minor.$((patch + 1))"
              version_code="$((configured_code + $(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | wc -l | tr -d ' ')))"
            fi
            tag_exists=false
          fi

          tag="v$version"
          if [ "$tag_exists" = false ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists for another commit; refusing to overwrite it." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "version_code=$version_code"
            echo "tag=$tag"
            echo "tag_exists=$tag_exists"
          } >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: frontend
        run: flutter build apk --release --build-name "${{ steps.version.outputs.version }}" --build-number "${{ steps.version.outputs.version_code }}"

      - name: Build release AAB
        working-directory: frontend
        run: flutter build appbundle --release --build-name "${{ steps.version.outputs.version }}" --build-number "${{ steps.version.outputs.version_code }}"

      - name: Verify generated artifacts
        run: |
          test -s frontend/build/app/outputs/flutter-apk/app-release.apk
          test -s frontend/build/app/outputs/bundle/release/app-release.aab

      - name: Create and push release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "${{ steps.version.outputs.tag_exists }}" = "true" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release and upload Android assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "frontend/build/app/outputs/flutter-apk/app-release.apk#gym_app-$VERSION.apk" \
              "frontend/build/app/outputs/bundle/release/app-release.aab#gym_app-$VERSION.aab"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Release $TAG" \
              --generate-notes \
              "frontend/build/app/outputs/flutter-apk/app-release.apk#gym_app-$VERSION.apk" \
              "frontend/build/app/outputs/bundle/release/app-release.aab#gym_app-$VERSION.aab"
          fi

  ios:
    name: Build and publish unsigned iOS archive
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Generate Drift code
        working-directory: frontend
        run: dart run build_runner build --delete-conflicting-outputs

      # No Apple Distribution certificate/provisioning profile is configured
      # yet, so this cannot produce a signed, installable .ipa (Apple requires
      # code signing to export one). --no-codesign still produces a real,
      # fully-built Runner.app for the current commit, which is packaged below
      # as a plain archive — useful to confirm the iOS build compiles and as a
      # QA artifact, but it cannot be installed on a device or submitted to
      # TestFlight/the App Store. See CI_NOTES.md for how to upgrade this to a
      # signed release once Apple credentials are available.
      - name: Build unsigned iOS app
        working-directory: frontend
        run: |
          flutter build ios --release --no-codesign \
            --build-name "${{ needs.android.outputs.version }}" \
            --build-number "${{ needs.android.outputs.version_code }}"

      - name: Package unsigned iOS archive
        working-directory: frontend/build/ios/iphoneos
        run: zip -r "../../../gym_app-${{ needs.android.outputs.version }}-ios-unsigned.zip" Runner.app

      - name: Verify generated artifact
        run: test -s "frontend/gym_app-${{ needs.android.outputs.version }}-ios-unsigned.zip"

      - name: Upload iOS archive to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.android.outputs.tag }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "frontend/gym_app-$VERSION-ios-unsigned.zip"
