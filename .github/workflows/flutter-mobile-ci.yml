name: Flutter Mobile CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: 3.24.5

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: "3.24.5"
      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend
      - name: Analyze
        run: flutter analyze
        working-directory: frontend
      - name: Test (fail if tests exist and break; no masking)
        run: flutter test
        working-directory: frontend

  build-android-release:
    name: Build Android release APK
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: "3.24.5"
      - run: flutter pub get
        working-directory: frontend
      - name: Build release APK
        run: flutter build apk --release
        working-directory: frontend
      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-v${{ github.run_id }}
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios-release:
    name: Build iOS release archive
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: "3.24.5"
      - run: flutter pub get
        working-directory: frontend
      - name: Build iOS release (no codesign for CI)
        run: flutter build ios --release --no-codesign
        working-directory: frontend
      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-app-v${{ github.run_id }}
          path: frontend/build/ios/iphoneos/Runner.app
          retention-days: 30
          if-no-files-found: warn

  publish-release:
    name: Publish release artifacts
    needs: [build-android-release, build-ios-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk-v${{ github.run_id }}
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: ios-release-app-v${{ github.run_id }}
          path: artifacts/ios
      - name: Zip iOS archive for release
        run: |
          mkdir -p artifacts/ios
          if [ -d artifacts/ios/Runner.app ]; then
            cd artifacts/ios && zip -r ios-release.app.zip Runner.app || echo "iOS zip skipped"
          else
            echo "No Runner.app found — iOS artifact missing or empty."
          fi
      - name: Create prerelease (tags) or release (push)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if echo "${{ github.ref }}" | grep -q "refs/tags/v"; then
            gh release create "${{ github.ref_name }}"               --repo "${{ github.repository }}"               --title "Release ${{ github.ref_name }}"               --prerelease --generate-notes               artifacts/android/app-release.apk               artifacts/ios/ios-release.app.zip || echo "Release already exists or skipped."
          else
            gh release create "build-${{ github.run_number }}-${{ github.sha }}"               --repo "${{ github.repository }}"               --title "Build ${{ github.run_number }} (push to main)"               --notes "Automated build from ${{ github.sha }} (run ${{ github.run_number }})."               --prerelease               artifacts/android/app-release.apk               artifacts/ios/ios-release.app.zip || echo "Prerelease creation skipped or already exists."
          fi
