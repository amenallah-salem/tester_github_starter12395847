version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aigym
      POSTGRES_USER: aigym
      POSTGRES_PASSWORD: aigym
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigym -d aigym"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata gym_api/fixtures/seed.json || true &&
             gunicorn gym_project.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-prod}
      DJANGO_DEBUG: "1"
      DB_ENGINE: postgres
      POSTGRES_DB: aigym
      POSTGRES_USER: aigym
      POSTGRES_PASSWORD: aigym
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  pg_data:
