version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: gym_postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gym_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gym_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gym_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym_backend_dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput || true &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: .env.dev
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./backend:/app
      - ./asserts:/asserts:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gym_network
    extra_hosts:
      # Fallback for a host service bound to 0.0.0.0 — not enough on its own
      # for freellmapi, whose own compose commonly publishes 127.0.0.1:3001
      # (loopback-only, unreachable via host.docker.internal too). docker.dev.sh
      # instead best-effort-joins this container to freellmapi's own Docker
      # network after startup (see FREELLMAPI_BASE_URL in .env.dev) — done in
      # the script, not declared here, so this compose file (and anyone not
      # using freellmapi) doesn't hard-fail when that network doesn't exist.
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data_dev:

networks:
  gym_network:
    driver: bridge
