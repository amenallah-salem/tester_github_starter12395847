# Production compose for backend (db + backend)

services:
  db:
    image: postgres:16-alpine
    container_name: gym_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to localhost only — no reason to expose Postgres to the internet.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gym_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym_backend
    # In production use gunicorn bound to all interfaces (0.0.0.0)
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput || true &&
             gunicorn gym_project.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env.prod
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - media_data:/app/media
    # Not published to the internet — Caddy (docker-compose.proxy.prod.yml)
    # is the only public entry point; 127.0.0.1 keeps this reachable for the
    # health-check probe in docker.prod.sh and for local debugging.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gym_network
    extra_hosts:
      # Fallback for a host service bound to 0.0.0.0 — not enough on its own
      # for freellmapi, whose own compose commonly publishes 127.0.0.1:3001
      # (loopback-only, unreachable via host.docker.internal too).
      # docker.prod.sh instead best-effort-joins this container to
      # freellmapi's own Docker network after startup, if it's running on
      # this host (see FREELLMAPI_BASE_URL in .env.prod) — done in the
      # script, not declared here, so this compose file (and anyone not
      # using freellmapi) doesn't hard-fail when that network doesn't exist.
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  media_data:

networks:
  gym_network:
    driver: bridge
