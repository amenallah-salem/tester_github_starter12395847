server {
    listen 80;
    server_name _;

    # Proxy ALL API calls (including OPTIONS preflight) to backend
    resolver 127.0.0.11 valid=30s;
    location /api/ {
        # Use a runtime-resolved backend host so nginx doesn't fail at startup if backend DNS isn't ready
        set $backend_host backend;
        # IMPORTANT: no URI segment (e.g. "/api/") after the port here. When
        # proxy_pass's target contains a variable, nginx cannot rewrite the
        # matched location prefix at config-load time, so any URI written
        # after the host:port is used verbatim for every request instead of
        # being combined with the incoming path. That previously caused every
        # request (e.g. /api/auth/register/, /api/auth/token/) to be sent to
        # the backend as a bare "/api/", which requires authentication and
        # made signup/login fail with "Authentication credentials were not
        # provided." Omitting the URI here makes nginx forward the original,
        # unmodified request URI (path + query string) to the backend.
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
