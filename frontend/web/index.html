<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gym Planner">
  <title>Gym Planner</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    #service-status {
      position: fixed; z-index: 1000; top: 16px; right: 16px; width: min(360px, calc(100vw - 32px));
      padding: 16px; border: 1px solid #d9dee7; border-radius: 12px; background: #fff;
      box-shadow: 0 8px 28px rgba(15, 23, 42, .14); color: #172033;
    }
    #service-status h1 { margin: 0 0 4px; font-size: 16px; }
    #service-status p { margin: 0 0 12px; color: #667085; font-size: 12px; }
    .service { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid #edf0f4; font-size: 13px; }
    .service-name { font-weight: 600; }
    .service-meta { display: block; margin-top: 2px; color: #667085; font-size: 11px; font-weight: 400; }
    .state { color: #667085; font-size: 12px; white-space: nowrap; }
    .state::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: #98a2b3; }
    .state.online { color: #087443; }
    .state.online::before { background: #12b76a; }
    .state.offline { color: #b42318; }
    .state.offline::before { background: #f04438; }
    .state.checking { color: #667085; }
    @media (max-width: 520px) { #service-status { top: 8px; right: 8px; width: calc(100vw - 16px); } }
  </style>
</head>
<body>
  <aside id="service-status" aria-live="polite">
    <h1>Gym Planner services</h1>
    <p>Live checks for the local Docker stack</p>
    <div class="service">
      <div><span class="service-name">Frontend</span><span class="service-meta">gym-planner-web · port 8080</span></div>
      <span class="state online">Running</span>
    </div>
    <div class="service">
      <div><span class="service-name">Backend</span><span class="service-meta">Django API · port 8000</span></div>
      <span id="backend-state" class="state checking">Checking</span>
    </div>
    <div class="service">
      <div><span class="service-name">Database</span><span class="service-meta">PostgreSQL · port 5432</span></div>
      <span id="database-state" class="state checking">Via backend</span>
    </div>
  </aside>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (async function checkServices() {
      const backendState = document.getElementById('backend-state');
      const databaseState = document.getElementById('database-state');
      try {
        const response = await fetch('http://localhost:8000/api/schema/', { mode: 'cors' });
        if (!response.ok && response.status !== 401 && response.status !== 403) throw new Error('Backend unavailable');
        backendState.textContent = 'Running';
        backendState.className = 'state online';
        databaseState.textContent = 'Connected';
        databaseState.className = 'state online';
      } catch (error) {
        backendState.textContent = 'Offline';
        backendState.className = 'state offline';
        databaseState.textContent = 'Unknown';
        databaseState.className = 'state offline';
      }
    }());
  </script>
</body>
</html>
