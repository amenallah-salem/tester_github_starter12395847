org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 defaults to a stricter "new DSL" that only reads Groovy property
# assignments written as `prop = value`. This project's signingConfigs block
# (android/app/build.gradle) still uses the older `prop value` method-call
# style, which the new DSL silently ignores rather than erroring — that would
# break release signing without any build failure to flag it. Opting out
# (matching what `flutter create` itself sets for existing/older-style
# projects on this Flutter version) keeps the current build.gradle working
# as-is instead of requiring a DSL rewrite.
android.newDsl=false
android.builtInKotlin=false
